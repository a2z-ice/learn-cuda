// ─── PROGRESS HOOK ────────────────────────────────────────────────────────────
function useProgress() {
  const [done, setDone] = useState(new Set());
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("nv_done");
        if (r) setDone(new Set(JSON.parse(r.value)));
      } catch(e) {}
    })();
  }, []);
  const markDone = useCallback(async (w) => {
    setDone(prev => {
      const n = new Set([...prev, w]);
      window.storage.set("nv_done", JSON.stringify([...n])).catch(()=>{});
      return n;
    });
  }, []);
  return { done, markDone };
}

// ─── PROMPT PANEL ─────────────────────────────────────────────────────────────
function PromptPanel({ week, phase, tabObj, isDone, onMarkDone }) {
  const [copied, setCopied] = useState(false);
  const prompt = buildPrompt(week, phase, tabObj.id);

  function copy() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(()=>{
        setCopied(true);
        setTimeout(()=>setCopied(false), 2500);
      });
    } else {
      // Fallback for browsers without clipboard API
      const ta = document.createElement("textarea");
      ta.value = prompt;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(()=>setCopied(false), 2500);
    }
  }

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Action bar */}
      <div style={{padding:"11px 20px",borderBottom:`1px solid ${C.border}`,background:"#09090f",display:"flex",alignItems:"center",gap:12,flexShrink:0,flexWrap:"wrap"}}>

          <div style={{fontSize:10,color:C.muted,marginBottom:1}}>Copy → paste into a new Claude.ai chat</div>
          <div style={{fontSize:12,fontWeight:700,color:"#f0ede6"}}>{tabObj.icon} {tabObj.label} prompt — W{week.w}: {week.t}</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>

            :<span style={{fontSize:11,color:"#76b900",fontWeight:700}}>✓ Week complete</span>
          }
          <button onClick={copy} style={{padding:"9px 22px",background:copied?"#3d7a00":"#76b900",border:"none",borderRadius:7,color:"#000",fontWeight:800,fontSize:13,cursor:"pointer",transition:"background .2s"}}>
            {copied?"✓  Copied!":"⎘  Copy Prompt"}
          </button>
        </div>
      </div>
      {/* Phase strip */}
      <div style={{padding:"7px 20px",borderBottom:`1px solid ${C.border}`,background:phase.col+"0d",display:"flex",alignItems:"center",gap:14,flexShrink:0,flexWrap:"wrap"}}>

        <span style={{fontSize:11,color:"#2a2a30"}}>·</span>

        {week.ms&&<><span style={{fontSize:11,color:"#2a2a30"}}>·</span><span style={{fontSize:11,color:phase.col}}>★ {week.ms}</span></>}
